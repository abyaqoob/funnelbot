[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
]
ignore = [
    "B008",  # Do not perform function call `Depends` in argument defaults (standard FastAPI idiom)
    "E402",  # Module level import not at top of file (allow UTC = timezone.utc compatibility)
    "E501",  # Line length (handled by formatter)
    "UP017", # Use datetime.UTC alias (avoid breaking Python 3.10)
    "UP042", # Class inherits from both `str` and `enum.Enum` (backward-compatible enum pattern)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=app --cov-report=term-missing"
