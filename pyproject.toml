[project]
name = "funnelbot"
version = "0.1.0"
description = "Zero-Budget DM & Comment Automation Funnel"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "sqlmodel>=0.0.21",
    "rapidfuzz>=3.9.0",
    "scikit-learn>=1.5.0",
    "numpy>=1.26.0",
    "slowapi>=0.1.9",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
    "pydantic>=2.8.0",
]

[tool.vercel]
entrypoint = "app/main.py:app"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
]
ignore = [
    "B008",  # Do not perform function call `Depends` in argument defaults (standard FastAPI idiom)
    "E402",  # Module level import not at top of file (allow UTC = timezone.utc compatibility)
    "E501",  # Line length (handled by formatter)
    "UP017", # Use datetime.UTC alias (avoid breaking Python 3.10)
    "UP042", # Class inherits from both `str` and `enum.Enum` (backward-compatible enum pattern)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=app --cov-report=term-missing"
